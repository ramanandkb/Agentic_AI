[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramanand", email = "135615511+ramanandkb@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=0.37.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langgraph-checkpoint>=4.3.0",
    "python-dotenv>=1.2.4",
    "typing-extensions>=4.16.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
